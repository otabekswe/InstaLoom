name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: instaloom_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: instaloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U instaloom_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn test --no-file-parallelism
        env:
          TEST_DATABASE_URL: postgresql://instaloom_test:local-test-only@127.0.0.1:5432/instaloom_test
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - run: yarn test:e2e
        env:
          INSTALOOM_E2E_DATABASE_URL: postgresql://instaloom_test:local-test-only@127.0.0.1:5432/instaloom_test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
